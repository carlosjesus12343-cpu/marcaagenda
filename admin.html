<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarcaAgenda — Área profissional</title><link rel="stylesheet" href="./styles.css"><style>
.plan-card{background:#f3eee8;border:1px solid var(--line);border-radius:18px;padding:20px;margin:18px 0}
.plan-top{display:flex;justify-content:space-between;gap:16px;align-items:center}.plan-name{font-size:1.35rem;font-weight:800}.badge-ok{background:#e6f0e9;color:#315c46;padding:7px 10px;border-radius:999px;font-size:.74rem;font-weight:800}.badge-warn{background:#fff2de;color:#7a5420;padding:7px 10px;border-radius:999px;font-size:.74rem;font-weight:800}
.entitlements{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.ent{background:white;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.84rem}.ent b{display:block;margin-bottom:3px}.lock{opacity:.48}
@media(max-width:700px){.entitlements{grid-template-columns:1fr}}
</style></head>
<body><header class="topbar"><a class="brand" href="./">MarcaAgenda</a><a class="quiet-link" href="./">Página de vendas</a></header>
<main class="admin-shell">
<section id="loginCard" class="admin-card" style="max-width:480px;margin:40px auto"><p class="eyebrow">ÁREA PROFISSIONAL</p><h1>Entrar</h1><p class="muted">Acesso exclusivo para profissionais e administradores.</p><form id="loginForm" class="form-grid" style="grid-template-columns:1fr;margin-top:24px"><label class="field"><span>E-mail</span><input id="email" type="email" required></label><label class="field"><span>Senha</span><input id="password" type="password" required></label><button class="primary">Entrar</button></form><div id="loginError" class="alert hidden"></div></section>
<section id="dashboard" class="hidden"><div style="display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:24px"><div><p class="eyebrow">PAINEL</p><h1 id="dashBusiness" style="margin:0">Agenda</h1></div><button id="logout" class="secondary">Sair</button></div>

<div id="planCard" class="plan-card">
  <div class="plan-top"><div><span class="muted">Seu plano</span><div id="planName" class="plan-name">Carregando...</div></div><span id="licenseBadge" class="badge-warn">Verificando licença</span></div>
  <div id="planPayment" class="muted" style="margin-top:6px"></div>
  <div id="entitlements" class="entitlements"></div>
</div>

<div class="admin-grid"><div class="metric"><span class="muted">Hoje</span><strong id="todayCount">0</strong></div><div class="metric"><span class="muted">Próximos</span><strong id="futureCount">0</strong></div><div class="metric"><span class="muted">Clientes</span><strong id="clientCount">0</strong></div></div>
<div class="admin-card" style="margin-top:16px"><h2>Próximos agendamentos</h2><div class="table-wrap"><table><thead><tr><th>Horário</th><th>Cliente</th><th>Serviço</th><th>Profissional</th><th>Status</th></tr></thead><tbody id="appointments"></tbody></table></div></div>
</section>
</main><script src="./admin.js" defer></script></body></html>
